<!DOCTYPE html>

<body class="bg-slate-900 text-slate-100 min-h-screen">

      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-lg bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400">

        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
            溙鼎環境科技 <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full font-normal">專案管理戰情室</span>
          </h1>
          <p class="text-xs text-slate-400">總經理專用檢視模式・週期自動推算雲端同步</p>
        </div>
      </div>
      
      <!-- 功能按鈕 -->
      <div class="flex items-center gap-3 no-print">
        <span id="sync-status" class="text-xs text-slate-400 flex items-center gap-1.5 mr-2">
          <i class="fa-solid fa-circle text-[8px] text-emerald-400 animate-pulse"></i> 雲端連線就緒
        </span>
        <button id="admin-toggle-btn" onclick="toggleAdminMode()" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 border border-slate-600 transition flex items-center gap-1.5">
          <i class="fa-solid fa-lock" id="admin-icon"></i> <span id="admin-btn-text">後台管理模式</span>
        </button>
        <button onclick="window.print()" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white transition flex items-center gap-1.5">
          <i class="fa-solid fa-print"></i> 列印報告
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-6 space-y-6">

      </div>
      <button onclick="openModal()" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 transition flex items-center gap-1.5">
        <i class="fa-solid fa-plus"></i> 新增專案案場
      </button>
    </div>

    <!-- 總覽數據 KPI 卡片 -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-slate-800/50 border border-slate-700/60 p-4 rounded-xl">
        <span class="text-xs text-slate-400 block mb-1">符合條件案場數</span>
        <div class="text-2xl font-bold text-white" id="stat-total">0</div>
      </div>
      <div class="bg-slate-800/50 border border-slate-700/60 p-4 rounded-xl">
        <span class="text-xs text-slate-400 block mb-1">進行中案場</span>
        <div class="text-2xl font-bold text-emerald-400" id="stat-progress">0</div>
      </div>
      <div class="bg-slate-800/50 border border-slate-700/60 p-4 rounded-xl">
        <span class="text-xs text-slate-400 block mb-1">商務評估中</span>
        <div class="text-2xl font-bold text-amber-400" id="stat-eval">0</div>

      <div class="bg-slate-800/50 border border-slate-700/60 p-4 rounded-xl">

        <div class="text-2xl font-bold text-blue-400" id="stat-avg-pct">0%</div>

    <!-- 週次篩選器與狀態篩選區 -->
    <section class="bg-slate-800/60 border border-slate-700 rounded-xl p-4 space-y-3 no-print">

        <div class="flex items-center gap-2">

            <i class="fa-regular fa-calendar-check text-emerald-400"></i> 週次推進篩選：

          <button onclick="toggleWeekDropdown()" class="px-3 py-1.5 text-xs bg-slate-900 border border-slate-600 rounded-lg text-slate-200 hover:border-emerald-500 transition flex items-center gap-2">
            <span id="selected-week-label">全部週次 (不限)</span>
            <i class="fa-solid fa-chevron-down text-[10px]"></i>
          </button>
          <button onclick="selectCurrentWeek()" class="px-2.5 py-1 text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-md hover:bg-emerald-500/20 transition">
            快速跳至本週
          </button>
          <button onclick="clearWeekFilter()" class="px-2.5 py-1 text-xs bg-slate-700/50 text-slate-400 rounded-md hover:text-slate-200 transition">
            重設週次
          </button>
        </div>

        <!-- 搜尋列 -->
        <input type="text" id="search-input" oninput="renderProjects()" placeholder="搜尋案場、負責人、動態..." class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 w-64">
      </div>

      <!-- 下拉勾選彈出清單 (2025 ~ 2027) -->
      <div id="week-dropdown-panel" class="hidden bg-slate-900 border border-slate-700 rounded-xl p-3 mt-2 shadow-2xl">
        <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-800 text-xs">
          <span class="text-slate-400">勾選欲檢視的週次（可複選，自動計算 2025 - 2027）：</span>
          <button onclick="toggleWeekDropdown()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="week-checkboxes-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2 max-h-56 overflow-y-auto text-xs pr-1">

        </div>
      </div>

      <!-- 狀態標籤切換 -->
      <div class="flex items-center gap-2 pt-2 border-t border-slate-700/40">
        <span class="text-xs text-slate-400">狀態：</span>
        <button onclick="filterStatus('ALL')" class="filter-btn px-3 py-1 text-xs rounded-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/30" data-filter="ALL">全部</button>
        <button onclick="filterStatus('進行中')" class="filter-btn px-3 py-1 text-xs rounded-lg bg-slate-900 text-slate-400 hover:text-slate-200" data-filter="進行中">進行中</button>
        <button onclick="filterStatus('評估中')" class="filter-btn px-3 py-1 text-xs rounded-lg bg-slate-900 text-slate-400 hover:text-slate-200" data-filter="評估中">評估中</button>

    </section>

    <!-- 專案卡片清單列表 -->
    <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- 動態載入專案卡片 -->
    </div>
  </main>

  <!-- 編輯 / 新增專案 Modal -->
  <div id="project-modal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-xl max-h-[92vh] overflow-y-auto p-6 space-y-4 shadow-2xl">

        <h3 class="text-base font-bold text-white" id="modal-title">編輯專案資訊</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="project-form" onsubmit="handleFormSubmit(event)" class="space-y-3 text-xs">

        <div>
          <label class="block text-slate-400 mb-1">專案名稱</label>

              <option value="評估中">評估中</option>

              <option value="驗收中">驗收中</option>
              <option value="已完工">已完工</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 mb-1">進度百分比 (%)</label>
            <input type="number" id="form-progress" min="0" max="100" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-200 focus:border-emerald-500 outline-none">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1">主責人員</label>
            <input type="text" id="form-owner" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-200 focus:border-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">預計完成日 / 期程備註</label>
            <input type="text" id="form-deadline" placeholder="例如：2026/04 或 4月上旬" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-200 focus:border-emerald-500 outline-none">
          </div>
        </div>

        <!-- 專案所屬週次勾選清單 -->
        <div>
          <label class="block text-slate-400 mb-1 flex items-center justify-between">
            <span>涵蓋執行／追蹤週次 (可勾選多週)：</span>
            <span class="text-[11px] text-emerald-400">已自動推算至 2027</span>
          </label>
          <div id="modal-weeks-list" class="bg-slate-900 border border-slate-700 rounded-lg p-3 max-h-36 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 gap-2">

          </div>
        </div>

        <div>
          <label class="block text-slate-400 mb-1">最新週報動態 / 現場進度</label>

        </div>
        <div>
          <label class="block text-slate-400 mb-1">風險與待辦支援</label>

        </div>
        <div class="pt-3 flex justify-end gap-2 border-t border-slate-700">

          <button type="submit" id="save-submit-btn" class="px-4 py-2 rounded bg-emerald-600 hover:bg-emerald-500 text-white font-bold">儲存並同步雲端</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 雲端資料庫設定 (JSONBin.io)
    const BIN_ID = "6ae716fdac6210605a6349af";
    const API_KEY = "$2a$10$TrBm5eEyLzx6qjw7Ek1L0eOB2CvVH5Fc59ZemW8tRMlNbbmnUUbz/6";

    // 自動生成 2025/01/06 至 2027/12/31 的每週一至週日列表
    const GENERATED_WEEKS = [];
    (function generateWeekList() {
      let currentMonday = new Date(2025, 0, 6); // 2025/01/06 週一
      const endDate = new Date(2027, 11, 31);

      function fmt(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}/${m}/${day}`;
      }

      while (currentMonday <= endDate) {
        let currentSunday = new Date(currentMonday);
        currentSunday.setDate(currentMonday.getDate() + 6);

        const rangeStr = `${fmt(currentMonday)} ~ ${fmt(currentSunday)}`;
        GENERATED_WEEKS.push(rangeStr);

        // 前進 7 天
        currentMonday.setDate(currentMonday.getDate() + 7);
      }
    })();

    // 取得當前本週字串
    function getCurrentWeekRange() {
      const now = new Date();
      const day = now.getDay();
      const diffToMon = (day === 0 ? -6 : 1) - day;
      const mon = new Date(now);
      mon.setDate(now.getDate() + diffToMon);
      const sun = new Date(mon);
      sun.setDate(mon.getDate() + 6);

      function fmt(d) {
        return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
      }
      return `${fmt(mon)} ~ ${fmt(sun)}`;
    }

    // 預設 15 筆案場資料（預設涵蓋當前推進週次）
    const thisWeek = getCurrentWeekRange();
    const DEFAULT_PROJECTS = [
      { id: 1, name: "苗栗銅鑼科學園區 - 廢水系統擴建", status: "進行中", progress: 65, owner: "閔松", deadline: "2026/05", weeks: [thisWeek], notes: "配管施作完成80%，預計下週進場測試水密性。", risk: "需注意機房電盤供電期程" },
      { id: 2, name: "高雄玉膳食品 - MBR 薄膜處理單元", status: "進行中", progress: 85, owner: "閔松", deadline: "2026/03", weeks: [thisWeek], notes: "MBR模組安裝完畢，已開始進行清水試運轉。", risk: "正常推展" },
      { id: 3, name: "聯電新市廠 - 熱泵熱水系統節能改造", status: "進行中", progress: 40, owner: "琮樺", deadline: "2026/06", weeks: [thisWeek], notes: "主機基座完成澆置，配管路徑已完成現勘套圖。", risk: "廠區施工工安稽核要求嚴格" },
      { id: 4, name: "復盛精密 - 表面處理放流水回收系統", status: "進行中", progress: 75, owner: "琮樺", deadline: "2026/04", weeks: [thisWeek], notes: "砂濾塔與活性碳吸附塔定位，控制盤接線中。", risk: "交期配合客戶停產檢修日" },
      { id: 5, name: "台南山上生技園區 - 沉澱池刮泥機更新", status: "進行中", progress: 30, owner: "閔松", deadline: "2026/07", weeks: [thisWeek], notes: "採購零件已下單，待停水排空後安排抽泥拆除。", risk: "正常推展" },
      { id: 6, name: "溙鼎內部 - 辦公室及實驗測試間裝修", status: "進行中", progress: 55, owner: "行政組", deadline: "2026/04", weeks: [thisWeek], notes: "隔間與水電配線完成，待油漆地磚與空調吊裝。", risk: "正常推展" },
      { id: 7, name: "富聯電子 - 晶圓清洗水純水回收評估", status: "評估中", progress: 15, owner: "業務組", deadline: "2026/Q3", weeks: [thisWeek], notes: "已提交初步方案與預算報價，待業主召開技術審查會。", risk: "競爭對手報價評估中" },
      { id: 8, name: "嘉義耐斯大埔美 - 污泥減量乾燥機評估", status: "評估中", progress: 20, owner: "業務組", deadline: "2026/Q2", weeks: [thisWeek], notes: "取樣污泥進行含水率與熱值化驗分析中。", risk: "需待分析報告出爐以敲定機型" },
      { id: 9, name: "屏東萬丹酪農區 - 沼氣脫硫及廢水再利用", status: "評估中", progress: 10, owner: "業務組", deadline: "2026/Q4", weeks: [thisWeek], notes: "主管機關補助方案初審中，已安排現場現勘。", risk: "環保局補助審核進度" },
      { id: 10, name: "日月光中壢廠 - 廢酸中和自動加藥改良", status: "評估中", progress: 25, owner: "琮樺", deadline: "2026/Q2", weeks: [thisWeek], notes: "已完成現場儀表校正現勘，準備第二輪技術簡報。", risk: "正常推展" },

      { id: 13, name: "彰濱綠能基地 - 雨水回收滯洪沉砂池改造", status: "評估中", progress: 5, owner: "雅淇", deadline: "2026/Q4", weeks: [thisWeek], notes: "剛取得土木建築套圖，評估進流管路高程。", risk: "正常推展" },
      { id: 14, name: "宜蘭龍德生醫 - 厭氧反應槽生物菌種培植", status: "評估中", progress: 15, owner: "閔松", deadline: "2026/Q3", weeks: [thisWeek], notes: "提供技術可行性報告與案例實績給業主研議。", risk: "正常推展" },
      { id: 15, name: "南港生技育成中心 - 小型實驗廢水處理機", status: "評估中", progress: 20, owner: "琮樺", deadline: "2026/Q2", weeks: [thisWeek], notes: "業主空間受限，正評估模組化立體成套設備方案。", risk: "空間狹小配管難度高" }
    ];

    let projects = [];
    let currentFilter = "ALL";
    let selectedWeeks = []; // 篩選中勾選的週次
    let isAdmin = false;

    const STATUS_MAP = {
      "進行中": { border: "border-emerald-500/40", badge: "bg-emerald-500/10 text-emerald-400 border-emerald-500/30", bar: "bg-emerald-500" },
      "評估中": { border: "border-amber-500/40", badge: "bg-amber-500/10 text-amber-400 border-amber-500/30", bar: "bg-amber-500" },
      "暫停": { border: "border-rose-500/40", badge: "bg-rose-500/10 text-rose-400 border-rose-500/30", bar: "bg-rose-500" },
      "驗收中": { border: "border-blue-500/40", badge: "bg-blue-500/10 text-blue-400 border-blue-500/30", bar: "bg-blue-500" },
      "已完工": { border: "border-slate-500/40", badge: "bg-slate-500/10 text-slate-400 border-slate-500/30", bar: "bg-slate-400" }
    };

    // 初始化渲染週次勾選框與資料載入
    async function init() {
      buildWeekCheckboxes();
      updateSyncStatus("載入雲端專案資料中...", "animate-pulse text-amber-400");
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { "X-Master-Key": API_KEY }
        });
        const data = await res.json();
        if (data.record && data.record.projects && data.record.projects.length > 0) {
          projects = data.record.projects;
          updateSyncStatus("雲端同步已連線", "text-emerald-400");
        } else {
          projects = DEFAULT_PROJECTS;
          await saveToCloud(true);
        }
      } catch (err) {
        console.warn("使用預設案場資料：", err);
        projects = DEFAULT_PROJECTS;
        updateSyncStatus("離線模式（本機瀏覽）", "text-slate-400");
      }
      updateStats();
      renderProjects();
    }

    // 建立頂部篩選面板中的週次勾選列表
    function buildWeekCheckboxes() {
      const container = document.getElementById("week-checkboxes-container");
      const current = getCurrentWeekRange();

      container.innerHTML = GENERATED_WEEKS.map(w => {
        const isCurrent = w === current;
        return `
          <label class="flex items-center gap-2 p-1.5 rounded hover:bg-slate-800 cursor-pointer ${isCurrent ? 'bg-emerald-500/10 border border-emerald-500/20 text-emerald-300' : 'text-slate-300'}">
            <input type="checkbox" value="${w}" onchange="handleWeekFilterChange(this)" class="accent-emerald-500 rounded">
            <span class="font-mono">${w}</span>
            ${isCurrent ? '<span class="text-[10px] bg-emerald-500 text-slate-950 px-1 rounded font-bold">本週</span>' : ''}
          </label>
        `;
      }).join('');
    }

    function toggleWeekDropdown() {
      document.getElementById("week-dropdown-panel").classList.toggle("hidden");
    }

    function handleWeekFilterChange(cb) {
      if (cb.checked) {
        selectedWeeks.push(cb.value);
      } else {
        selectedWeeks = selectedWeeks.filter(item => item !== cb.value);
      }
      updateSelectedWeekLabel();
      updateStats();
      renderProjects();
    }

    function updateSelectedWeekLabel() {
      const label = document.getElementById("selected-week-label");
      if (selectedWeeks.length === 0) {
        label.innerText = "全部週次 (不限)";
      } else if (selectedWeeks.length === 1) {
        label.innerText = selectedWeeks[0];
      } else {
        label.innerText = `已勾選 ${selectedWeeks.length} 個週次`;
      }
    }

    function selectCurrentWeek() {
      const current = getCurrentWeekRange();
      selectedWeeks = [current];
      // 同步勾選狀態
      document.querySelectorAll("#week-checkboxes-container input[type='checkbox']").forEach(cb => {
        cb.checked = (cb.value === current);
      });
      updateSelectedWeekLabel();
      updateStats();
      renderProjects();
    }

    function clearWeekFilter() {
      selectedWeeks = [];
      document.querySelectorAll("#week-checkboxes-container input[type='checkbox']").forEach(cb => cb.checked = false);
      updateSelectedWeekLabel();
      updateStats();
      renderProjects();
    }

    function updateSyncStatus(text, colorClass) {
      const el = document.getElementById("sync-status");
      el.className = `text-xs flex items-center gap-1.5 mr-2 ${colorClass}`;
      el.innerHTML = `<i class="fa-solid fa-circle text-[8px]"></i> ${text}`;
    }

    // 儲存至 JSONBin
    async function saveToCloud(isSilent = false) {
      const submitBtn = document.getElementById("save-submit-btn");
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerText = "雲端儲存中...";
      }
      updateSyncStatus("同步儲存中...", "animate-pulse text-amber-400");

      try {
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": API_KEY
          },
          body: JSON.stringify({ projects: projects })
        });
        updateSyncStatus("雲端同步完成", "text-emerald-400");
        if (!isSilent) alert("專案已成功儲存至雲端！總經理現在開啟網址即可看到最新進度。");
      } catch (err) {
        console.error(err);
        alert("雲端同步失敗，請檢查網路連線。");
        updateSyncStatus("同步失敗", "text-rose-400");
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerText = "儲存並同步雲端";
        }
      }
    }

    // 更新 KPI 統計
    function updateStats() {
      const filtered = getFilteredProjects();
      const total = filtered.length;
      const progressCount = filtered.filter(p => p.status === "進行中").length;
      const evalCount = filtered.filter(p => p.status === "評估中").length;
      const avgPct = total ? (filtered.reduce((acc, p) => acc + Number(p.progress || 0), 0) / total).toFixed(1) : 0;

      document.getElementById("stat-total").innerText = total;
      document.getElementById("stat-progress").innerText = progressCount;
      document.getElementById("stat-eval").innerText = evalCount;
      document.getElementById("stat-avg-pct").innerText = avgPct + "%";
    }

    // 過濾專案列表
    function getFilteredProjects() {
      const searchKey = document.getElementById("search-input").value.trim().toLowerCase();

      return projects.filter(p => {
        // 狀態過濾
        const matchStatus = currentFilter === "ALL" ? true :
          (currentFilter === "暫停/驗收" ? (p.status === "暫停" || p.status === "驗收中" || p.status === "已完工") : p.status === currentFilter);
        
        // 搜尋字詞
        const matchSearch = p.name.toLowerCase().includes(searchKey) ||
          p.owner.toLowerCase().includes(searchKey) ||
          (p.notes && p.notes.toLowerCase().includes(searchKey));

        // 週次勾選過濾 (若無選週次則全部呈現；若有選，專案需涵蓋至少一個勾選週次)
        let matchWeek = true;
        if (selectedWeeks.length > 0) {
          if (!p.weeks || !Array.isArray(p.weeks) || p.weeks.length === 0) {
            matchWeek = false;
          } else {
            matchWeek = p.weeks.some(w => selectedWeeks.includes(w));
          }
        }

        return matchStatus && matchSearch && matchWeek;
      });
    }

    // 渲染專案卡片
    function renderProjects() {
      const container = document.getElementById("projects-grid");
      const filtered = getFilteredProjects();

      if (filtered.length === 0) {
        container.innerHTML = `<div class="col-span-full py-12 text-center text-slate-500 text-xs">查無符合目前篩選週次或狀態的專案案場</div>`;
        return;
      }

      container.innerHTML = filtered.map(p => {
        const theme = STATUS_MAP[p.status] || STATUS_MAP["進行中"];
        const displayWeeks = (p.weeks && p.weeks.length > 0) ? p.weeks.slice(0, 2).join('、') + (p.weeks.length > 2 ? ` 等${p.weeks.length}週` : '') : "未指定週次";

        return `
          <div class="bg-slate-800/60 border ${theme.border} rounded-xl p-5 flex flex-col justify-between hover:border-slate-500 transition-all shadow-sm">
            <div>
              <div class="flex justify-between items-start gap-2 mb-2">
                <span class="text-xs px-2 py-0.5 rounded-full font-medium border ${theme.badge}">${p.status}</span>
                <span class="text-xs text-slate-400 font-medium"><i class="fa-solid fa-user-tie text-[10px] mr-1"></i>${p.owner}</span>
              </div>
              <h3 class="text-sm font-bold text-white mb-2 line-clamp-1" title="${p.name}">${p.name}</h3>

              <!-- 週次標籤 -->
              <div class="text-[11px] text-slate-400 font-mono mb-3 flex items-center gap-1">
                <i class="fa-regular fa-calendar text-emerald-400 text-[10px]"></i>
                <span class="truncate" title="${(p.weeks || []).join(', ')}">${displayWeeks}</span>
              </div>
              
              <!-- 進度條 -->
              <div class="space-y-1 mb-4">
                <div class="flex justify-between text-xs text-slate-400 font-mono">
                  <span>進度推進</span>
                  <span class="text-white font-bold">${p.progress}%</span>
                </div>
                <div class="w-full h-2 bg-slate-950 rounded-full overflow-hidden">
                  <div class="h-full ${theme.bar} transition-all duration-500" style="width: ${p.progress}%"></div>
                </div>
              </div>

              <!-- 動態與風險 -->
              <div class="bg-slate-900/70 border border-slate-700/50 rounded-lg p-3 text-xs space-y-2 mb-3">
                <p class="text-slate-300 leading-relaxed"><span class="text-slate-500 font-medium">動態：</span>${p.notes || "無特別備註"}</p>
                <div class="flex items-center gap-1.5 text-[11px] ${p.risk === "正常推展" ? "text-slate-400" : "text-amber-400"}">
                  <i class="fa-solid fa-triangle-exclamation text-[10px]"></i>
                  <span>風險：${p.risk || "正常推展"}</span>
                </div>
              </div>
            </div>

            <div class="flex justify-between items-center text-xs text-slate-500 pt-2 border-t border-slate-700/50">
              <span>期程：${p.deadline || "依節點"}</span>
              ${isAdmin ? `
                <div class="space-x-2">
                  <button onclick="editProject(${p.id})" class="text-emerald-400 hover:text-emerald-300"><i class="fa-solid fa-pen-to-square"></i> 編輯</button>
                  <button onclick="deleteProject(${p.id})" class="text-rose-400 hover:text-rose-300"><i class="fa-solid fa-trash"></i> 刪除</button>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function filterStatus(status) {
      currentFilter = status;
      document.querySelectorAll(".filter-btn").forEach(btn => {
        if (btn.getAttribute("data-filter") === status) {
          btn.className = "filter-btn px-3 py-1 text-xs rounded-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
        } else {
          btn.className = "filter-btn px-3 py-1 text-xs rounded-lg bg-slate-900 text-slate-400 hover:text-slate-200";
        }
      });
      updateStats();
      renderProjects();
    }

    function toggleAdminMode() {
      isAdmin = !isAdmin;
      document.getElementById("admin-panel").classList.toggle("hidden", !isAdmin);
      document.getElementById("admin-btn-text").innerText = isAdmin ? "退出管理" : "後台管理模式";
      document.getElementById("admin-icon").className = isAdmin ? "fa-solid fa-lock-open text-emerald-400" : "fa-solid fa-lock";
      renderProjects();
    }

    // Modal 與週次清單生成
    function renderModalWeeks(selectedList = []) {
      const container = document.getElementById("modal-weeks-list");
      const current = getCurrentWeekRange();

      container.innerHTML = GENERATED_WEEKS.map(w => {
        const checked = selectedList.includes(w) ? 'checked' : '';
        const isCurrent = w === current;
        return `
          <label class="flex items-center gap-1.5 p-1 rounded hover:bg-slate-800 cursor-pointer ${isCurrent ? 'text-emerald-400 font-semibold' : 'text-slate-300'}">
            <input type="checkbox" name="modal-week" value="${w}" ${checked} class="accent-emerald-500 rounded">
            <span class="font-mono text-[11px]">${w}</span>
            ${isCurrent ? '<span class="text-[9px] bg-emerald-500/20 text-emerald-400 px-1 rounded">本週</span>' : ''}
          </label>
        `;
      }).join('');
    }

    function openModal(id = null) {
      document.getElementById("project-modal").classList.remove("hidden");
      if (id) {
        const p = projects.find(item => item.id === id);
        document.getElementById("modal-title").innerText = "編輯專案案場";
        document.getElementById("form-id").value = p.id;
        document.getElementById("form-name").value = p.name;
        document.getElementById("form-status").value = p.status;
        document.getElementById("form-progress").value = p.progress;
        document.getElementById("form-owner").value = p.owner;
        document.getElementById("form-deadline").value = p.deadline;
        document.getElementById("form-notes").value = p.notes;
        document.getElementById("form-risk").value = p.risk;
        renderModalWeeks(p.weeks || []);
      } else {
        document.getElementById("modal-title").innerText = "新增專案案場";
        document.getElementById("form-id").value = "";
        document.getElementById("project-form").reset();
        document.getElementById("form-status").value = "進行中";
        document.getElementById("form-progress").value = "10";
        document.getElementById("form-risk").value = "正常推展";
        renderModalWeeks([getCurrentWeekRange()]);
      }
    }

    function closeModal() {
      document.getElementById("project-modal").classList.add("hidden");
    }

    function editProject(id) {
      openModal(id);
    }

    async function deleteProject(id) {
      if (confirm("確定要刪除這筆專案案場嗎？此操作將會直接同步更新至雲端。")) {
        projects = projects.filter(p => p.id !== id);
        updateStats();
        renderProjects();
        await saveToCloud();
      }
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const id = document.getElementById("form-id").value;

      // 取得在 Modal 中勾選的所有週次
      const checkedWeeks = [];
      document.querySelectorAll("#modal-weeks-list input[name='modal-week']:checked").forEach(cb => {
        checkedWeeks.push(cb.value);
      });

      const projectData = {
        name: document.getElementById("form-name").value,
        status: document.getElementById("form-status").value,
        progress: Number(document.getElementById("form-progress").value),
        owner: document.getElementById("form-owner").value,
        deadline: document.getElementById("form-deadline").value,
        weeks: checkedWeeks,
        notes: document.getElementById("form-notes").value,
        risk: document.getElementById("form-risk").value
      };

      if (id) {
        const index = projects.findIndex(p => p.id === Number(id));
        if (index !== -1) {
          projects[index] = { ...projects[index], ...projectData };
        }
      } else {
        projectData.id = Date.now();
        projects.unshift(projectData);
      }

      closeModal();
      updateStats();
      renderProjects();
      await saveToCloud();
    }

    window.onload = init;
  </script>
</body>
</html>
